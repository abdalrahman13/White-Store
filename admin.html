<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>White Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <style></style>
  </head>
  <body>
    <a class="home" href="index.html">Home Page</a>
    <button class="btn btn-danger" id="logoutBtn">Logout</button>
    <div action="" class="form">
      <div class="container">
        <input
          type="file"
          class="form-control"
          placeholder="Image_URL"
          id="image"
        />
        <input
          type="text"
          class="form-control"
          placeholder="Product Name"
          id="name"
        />
        <input
          type="number"
          class="form-control"
          placeholder="Price"
          id="price"
        />
        <input
          type="text"
          class="form-control"
          placeholder="Product Category"
          id="category"
        />
        <input
          type="text"
          class="form-control"
          placeholder="Product Description"
          id="description"
        />

        <input type="submit" value="Add" id="addBtn" class="add-btn" />
        <div id="productsContainer"></div>
      </div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customAlert" class="custom-alert-overlay">
      <div class="custom-alert-box">
        <div class="custom-alert-icon" id="alertIcon">✨</div>
        <h3 id="alertTitle" class="custom-alert-title">تنبيه</h3>
        <p id="alertMessage" class="custom-alert-message">هذا نص الرسالة</p>
        <div
          id="alertActions"
          style="display: flex; gap: 10px; justify-content: center"
        >
          <button class="custom-alert-btn" onclick="closeCustomAlert()">
            موافق
          </button>
        </div>
      </div>
    </div>

    <script src="js/alert.js"></script>
    <script src="js/supabaseClient.js" type="module"></script>
    <script src="js/admin.js" type="module"></script>
  </body>
</html>
