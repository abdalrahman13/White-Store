<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>White Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <a href="index.html">Home Page</a>
    <div class="login-form" id="loginForm">
      <div class="container">
        <form class="" action="">
          <label for="em">Email: </label>
          <input
            class="form-control"
            type="email"
            placeholder="Please Type The Username"
            name="userN"
            id="em"
          />
          <label for="pass">Password: </label>
          <input
            class="form-control"
            type="password"
            placeholder="Please Type The Password"
            name="pass"
            id="pass"
          />
          <div class="showpassword">
            <input type="checkbox" name="" id="checkbox" />
            <label for="checkbox">show password</label>
          </div>
          <input type="submit" value="Login" name="" id="emailLoginBtn" />
        </form>
      </div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customAlert" class="custom-alert-overlay">
      <div class="custom-alert-box">
        <div class="custom-alert-icon" id="alertIcon">✨</div>
        <h3 id="alertTitle" class="custom-alert-title">تنبيه</h3>
        <p id="alertMessage" class="custom-alert-message">هذا نص الرسالة</p>
        <div
          id="alertActions"
          style="display: flex; gap: 10px; justify-content: center"
        >
          <button class="custom-alert-btn" onclick="closeCustomAlert()">
            موافق
          </button>
        </div>
      </div>
    </div>

    <script src="js/alert.js"></script>
    <script src="js/supabaseClient.js" type="module"></script>
    <script src="js/login.js" type="module"></script>
  </body>
</html>
